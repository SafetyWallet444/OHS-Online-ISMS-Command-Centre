<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>OHS Online ISMS Command Centre</title>
<style>html,body{height:100%;margin:0;font-family:system-ui;background:#0d2238;color:white}main{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.ring{width:54px;height:54px;border:6px solid #ffffff33;border-top-color:#00a89d;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{color:#b9c8d4}</style>
</head><body><main><div><div class="ring"></div><h1>OHS Online ISMS</h1><p id="status">Loading your management system…</p></div></main>
<script>
(async()=>{
 const files=["payload/chunk-01.txt","payload/chunk-02.txt","payload/chunk-03.txt","payload/chunk-04.txt","payload/chunk-05.txt"];
 try{
  const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
  const b64=parts.join('');
  const bin=atob(b64); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('status').textContent='The app could not load: '+e.message;console.error(e)}
})();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(console.error));
</script></body></html>
